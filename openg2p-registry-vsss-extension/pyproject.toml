[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-registry-vsss-extension"
description = "OpenG2P Registry VSSS Extension (Uganda)"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MPL-2.0" }

authors = [
  { name = "OpenG2P", email = "info@openg2p.org" },
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]

dependencies = [
  "openg2p-fastapi-common >=1.1.2",
  "openg2p-g2pconnect-common-lib >=1.1.0",
  "greenlet",
  "psycopg[binary]",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/OpenG2P/openg2p-registry-extension"

[tool.hatch.version]
path = "src/openg2p_registry_vsss_extension/__init__.py"

# The package installs under its OWN import name (openg2p_registry_vsss_extension)
# — there is no alias onto openg2p_registry_extensions. Each image selects the
# domain model at runtime with REGISTRY_EXTENSION_MODULE, which the platform
# entrypoints alias into sys.modules at startup. That lets this extension and the
# platform's reference extension coexist in one image without colliding.
