name: Build & Publish

# Builds and pushes the VSSS images to Docker Hub. This repo does not call
# openg2p/openg2p-packaging, so it does not need packages: write or an
# OpenG2P Helm publish token.

on:
  push:
    branches: ["develop"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openg2p-vsss-staff-portal-api
            dockerfile: docker/staff-portal-api/Dockerfile
          - name: openg2p-vsss-partner-api
            dockerfile: docker/partner-api/Dockerfile
          - name: openg2p-vsss-celery
            dockerfile: docker/celery/Dockerfile
          - name: openg2p-vsss-db-seed
            dockerfile: docker/db-seed/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            natiabebaw12/${{ matrix.name }}:${{ github.sha }}
            natiabebaw12/${{ matrix.name }}:${{ github.ref_type == 'tag' && github.ref_name || 'develop' }}
