name: Publish Helm Charts

# Package helm/vsss WITH `helm dep up` so Rancher / helm install get charts/
# (common, postgres-init, redis, id-generator, keycloak-init, openg2p-awe).
# Uploading a tgz built without deps fails before any pods (including db-seed).

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - "helm/**"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package chart (with dependencies)
        run: |
          chmod +x helm/scripts/package.sh
          ./helm/scripts/package.sh .

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsss-helm-chart
          path: ./vsss-*.tgz
