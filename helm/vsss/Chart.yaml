apiVersion: v2
name: vsss
description: |
  MGLSD Village Social Security System — a thin, branded package over the shared
  openg2p-registry chart published by the registry platform.

  This chart declares openg2p-registry as a pinned dependency and supplies the
  VSSS values overlay (variant identity, hostname, VSSS-built images, seed
  toggles, Individual/Household/Village id types and the IAM tile name). It owns
  no templates of its own — everything deployed comes from the openg2p-registry
  subchart. VSSS has no inbound connectors; see values.yaml for what was removed
  and what adding a real one would require.
type: application

# Version handling:
#   This `version` is a STATIC placeholder — it is NOT the published version.
#   The central CI pipeline (build-publish.yml -> openg2p-packaging @v1) derives
#   the real version from git (one version per commit) and overrides it at
#   publish time, in lockstep with the VSSS images this chart references.
version: 1.2.0
appVersion: "1.2.0"

keywords:
  - openg2p
  - mglsd
  - registry
  - social-registry
  - vsss
home: https://openg2p.org
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
sources:
  - https://github.com/OpenG2P/openg2p-registry-vsss-extensions
maintainers:
  - name: OpenG2P
    email: info@openg2p.org

# bitnami/common — kept declared for parity with the other variant charts and
# because openg2p-registry pulls it transitively anyway. This chart no longer
# has templates of its own that need the tplvalues helpers.
#
# openg2p-registry brings the registry services (staff/partner API, celery,
# db-seed, staff UI, iam-register) and its own subcharts (postgres-init, redis,
# id-generator, keycloak-init, openg2p-awe) — none of those are declared here,
# so there is exactly ONE platform pin to keep in step with the Dockerfiles'
# ARG RP_VERSION (guarded by test/test_rp_pin_lockstep.py).
dependencies:
  - name: common
    repository: https://openg2p.github.io/openg2p-helm
    version: 2.30.0
  - name: openg2p-registry
    alias: registry
    version: 1.2.2-rc.544
    repository: https://openg2p.github.io/openg2p-helm

annotations:
  catalog.cattle.io/display-name: "OpenG2P MGLSD VSSS"
  catalog.cattle.io/certified: partner
  catalog.cattle.io/kube-version: ">=1.23.0-0"
  openg2p.org/add-to-rancher: ""
