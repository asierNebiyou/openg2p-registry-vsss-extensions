# VSSS-only Rancher questions. Registry questions are inherited at publish
# time via CHART_INHERIT_QUESTIONS from the openg2p-registry dependency.
questions:
  - variable: connector.enabled
    description: Deploy the connector stack (api, worker, beat, admin UI) that pulls registrations from ODK Central and WebSub hubs into the registry
    type: boolean
    label: Enable Connector
    group: Connector

  - variable: global.connectorHostname
    description: Public hostname for the connector API + admin UI (WebSub hubs deliver webhooks to https://<host>/webhook/...)
    type: string
    label: Connector Hostname
    group: Connector

  - variable: connector.image.tag
    description: Image tag for the connector service (api/worker/beat roles)
    type: string
    label: Connector Service Image Tag
    group: Connector

  - variable: connector.seed.enabled
    description: Seed connector definitions (EDRMC WebSub, UD SR WebSub, ODK VSSS) through the connector API after install/upgrade. Credentials come from the Secret named <release>-connector-seed.
    type: boolean
    label: Seed Connector Definitions
    group: Connector
