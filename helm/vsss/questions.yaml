# VSSS-only Rancher questions. Registry questions are inherited at publish time
# via CHART_INHERIT_QUESTIONS from the openg2p-registry dependency.
questions:
  - variable: global.vsssImageNamespace
    description: Docker Hub namespace the VSSS images are pulled from. Leave as openg2p for released images; set to a personal namespace for pre-release builds.
    type: string
    label: VSSS Image Namespace
    group: VSSS

  - variable: global.vsssImageTag
    description: Tag for the VSSS-built images (staff portal API, partner API, celery, db-seed).
    type: string
    label: VSSS Image Tag
    group: VSSS
