  image:
    repository: asierneb/openg2p-vsss-db-seed
    tag: develop
    PullSecrets: ""

partnerApi:
  image:
    repository: asierneb/openg2p-vsss-partner-api
    tag: develop
    PullSecrets: ""

staffPortalApi:
  image:
    repository: asierneb/openg2p-vsss-staff-portal-api
    tag: develop
    PullSecrets: ""

staffPortalUi:
  image:
    repository: openg2p/openg2p-registry-staff-portal-ui
    tag: "1.1.1"

celeryBeatProducer:
  image:
    repository: asierneb/openg2p-vsss-celery
    tag: develop
    PullSecrets: ""

celeryWorker:
  image:
    repository: asierneb/openg2p-vsss-celery
    tag: develop
    PullSecrets: ""

connector:
  image:
    repository: asierneb/openg2p-connector-service
    tag: nsr-slashfix-202605221435
