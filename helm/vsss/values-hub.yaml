# Overlay for public Docker Hub images (no gitlab-registry secret).
# Defaults in values.yaml already use these Hub tags. Nest overrides under
# `registry.` because service images belong to the openg2p-registry subchart.

registry:
  dbSeed:
    image:
      repository: asierneb/openg2p-vsss-db-seed
      tag: "1.2.0"

  staffApi:
    image:
      repository: asierneb/openg2p-vsss-staff-portal-api
      tag: "1.2.0"

  partnerApi:
    image:
      repository: asierneb/openg2p-vsss-partner-api
      tag: "1.2.0"

  celeryBeat:
    image:
      repository: asierneb/openg2p-vsss-celery
      tag: "1.2.0"

  celeryWorker:
    image:
      repository: asierneb/openg2p-vsss-celery
      tag: "1.2.0"

connector:
  image:
    repository: asierneb/openg2p-connector-service
    tag: nsr-slashfix-202605221435
    PullSecrets: ""
  ui:
    image:
      repository: asierneb/openg2p-connector-ui
      tag: nsr
