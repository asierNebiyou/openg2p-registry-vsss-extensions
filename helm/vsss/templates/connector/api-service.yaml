{{- if and .Values.connector.enabled .Values.connector.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-connector-api
  labels: {{- include "connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.connector.api.service.port }}
      targetPort: {{ .Values.connector.api.containerPort }}
      protocol: TCP
  selector: {{- include "connector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: connector-api
{{- end }}
