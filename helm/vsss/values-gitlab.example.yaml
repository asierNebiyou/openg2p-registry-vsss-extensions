# Example overlay when VSSS images are published to GitLab.
# Replace PROJECT/PATH with your GitLab project.
# Staff UI stays the public openg2p-registry-staff-ui image from the subchart.
#
# kubectl -n <ns> create secret docker-registry gitlab-registry \
#   --docker-server=registry.gitlab.com \
#   --docker-username='<deploy-token-user>' \
#   --docker-password='<deploy-token>'

registry:
  dbSeed:
    image:
      repository: registry.gitlab.com/PROJECT/PATH/db-seed
      tag: "1.2.0"
      imagePullSecrets: ["gitlab-registry"]

  staffApi:
    image:
      repository: registry.gitlab.com/PROJECT/PATH/staff-api
      tag: "1.2.0"
      imagePullSecrets: ["gitlab-registry"]

  partnerApi:
    image:
      repository: registry.gitlab.com/PROJECT/PATH/partner-api
      tag: "1.2.0"
      imagePullSecrets: ["gitlab-registry"]

  celeryBeat:
    image:
      repository: registry.gitlab.com/PROJECT/PATH/celery
      tag: "1.2.0"
      imagePullSecrets: ["gitlab-registry"]

  celeryWorker:
    image:
      repository: registry.gitlab.com/PROJECT/PATH/celery
      tag: "1.2.0"
      imagePullSecrets: ["gitlab-registry"]
