# Example overlay when VSSS images are published to GitLab like NSR 1.1.3.
# Replace PROJECT/PATH with your GitLab project (e.g. mowsa1/vsss/village-social-security-registry).
#
# kubectl -n <ns> create secret docker-registry gitlab-registry \
#   --docker-server=registry.gitlab.com \
#   --docker-username='<deploy-token-user>' \
#   --docker-password='<deploy-token>'

dbSeed:
  image:
    repository: registry.gitlab.com/PROJECT/PATH/db-seed
    tag: "1.1.3"
    pullSecrets:
      - name: gitlab-registry

staffPortalApi:
  image:
    registry: registry.gitlab.com
    repository: PROJECT/PATH/staff-api
    tag: "1.1.3"
    pullSecrets:
      - name: gitlab-registry

partnerApi:
  image:
    registry: registry.gitlab.com
    repository: PROJECT/PATH/partner-api
    tag: "1.1.3"
    pullSecrets:
      - name: gitlab-registry

staffPortalUi:
  image:
    registry: registry.gitlab.com
    repository: PROJECT/PATH/staff-ui
    tag: "1.1.3"
    pullSecrets:
      - name: gitlab-registry

celeryBeatProducer:
  image:
    registry: registry.gitlab.com
    repository: PROJECT/PATH/celery
    tag: "1.1.3"
    pullSecrets:
      - name: gitlab-registry

celeryWorker:
  image:
    registry: registry.gitlab.com
    repository: PROJECT/PATH/celery
    tag: "1.1.3"
    pullSecrets:
      - name: gitlab-registry
