global:
  registryVariant: 'vsss'
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

  # Database
  postgresqlHost: commons-postgresql

  registryDB:  '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # Master Data DB credentials — must match the values set by the
  # openg2p-commons-services chart (release `commons-services`). Commons
  # uses plain DB names (no release-name prefix) since only one Master
  # Data instance is expected per environment.
  masterDataDB: 'master_data'
  masterDataDBPort: 5432
  masterDataDBUser: 'master_data_user'
  masterDataDBSecret: 'master-data'
  masterDataDBUserPasswordKey: 'master-data-db-user'

  # Redis
  # Celery broker/backend — per-release registry Redis.
  redisInstallationName: '{{ .Release.Name }}-redis-master'
  # Auth session store — MUST match IAM (commons-services) Redis. Staff
  # portal API validates login cookies against this store; pointing it at
  # registry Redis causes 401s (e.g. get-all-languages) and an IAM reload loop.
  authRedisInstallationName: 'commons-redis-master'

  # Minio
  minioSecret: commons-minio
  minioAccessKey: root-user
  minioSecretKey: root-password
  # External MinIO S3 API endpoint. Must be reachable from end-user browsers
  # because the registry generates pre-signed S3 URLs that browsers follow
  # directly. Commons-base's Istio VirtualService exposes the S3 API at
  # `minio-api.<basedomain>` (apiHost in commons-base values.yaml). The
  # default below is a placeholder using the namespace + openg2p.org —
  # OPERATORS MUST override this in `questions.yaml` / Rancher UI / values
  # file to match their actual base domain. NOTE: `minio.<basedomain>` is
  # the *Console* UI — do NOT point S3 clients at it.
  minioHost: 'minio.{{ .Release.Namespace }}.openg2p.org'
  # MinIO buckets — hard-set to match DocumentBucket enum values used by
  # the platform document handler (physical bucket name == enum value).
  # Catalog rows store bucket as 'templates' / 'documents' / 'default'.
  defaultBucketName: 'default'
  templateBucketName: 'templates'
  # Registrant photos / record images land in the documents bucket and are
  # catalogued in g2p_registry_documents (see docker/db-seed/upload_images.py).
  documentsBucketName: 'documents'
  minioSecure: true

  # Security & Authentication
  keymanagerInstallationName: commons-services-keymanager
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  # Single shared `staff` realm per namespace — all registry releases (and
  # other apps like AWE) authenticate against the same realm; each release
  # gets its OWN client (clientId below) inside that shared realm.
  keycloakRealm: 'staff'
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'

  registryKeymanagerAuthEnabled: false
  # Per-release keymanager app id (uppercased Release.Name) so signature
  # scopes don't collide across registry instances in the same environment.
  registryKeymanagerAppId: '{{ .Release.Name | upper }}'
  # OIDC client ID — per-release; MUST equal the clientId in keycloak-init.realms below.
  authClientId: '{{ .Release.Name }}-staff-portal'
  # K8s Secret name holding the client password (keycloak-init names the
  # Secret after the clientId, so this must match authClientId above).
  authClientSecret: '{{ .Release.Name }}-staff-portal'
  # Key inside the secret containing the client password
  authClientSecretKey: 'client_secret'

  # Keycloak Admin API — publish data policies as DP_<mnemonic> client roles
  # (tactical 1.2.0). Use the registry staff-portal client's service account
  # (provisioned by this chart's keycloak-init) with realm-management roles.
  keycloakAdminClientId: 'registry-staff-portal'
  keycloakAdminClientSecret: 'registry-staff-portal'
  keycloakAdminClientSecretKey: 'client_secret'
  keycloakDataPolicyRoleSyncEnabled: true

  # IAM service internal URL — server-side / in-cluster only (API, jobs).
  iamServiceUrl: 'http://commons-services-iam-staff-portal-api'
  # Public IAM URL — Staff Portal UI redirects the browser here (login callback
  # hops and especially /api/logout). Must be reachable from the user's browser;
  # the in-cluster Service DNS breaks logout in the UI.
  iamPublicUrl: 'https://staff-iam.{{ .Release.Namespace }}.openg2p.org'

  # Master Data API internal URL
  # commons-services-master-data-api is scaled to 0 in sandbox; use the active release.
  masterDataApiUrl: 'http://master-data-master-data-api'

  # ID Generator
  # Public hostname (used by browser/external callers via Istio VirtualService).
  idGeneratorHostname: 'idgenerator-{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'
  idGeneratorApiUrl: 'https://{{ tpl .Values.global.idGeneratorHostname $ }}/v1'
  # Internal cluster URL — used by sibling pods (e.g. celery-worker) to reach
  # the ID Generator without hopping through the ingress gateway. The K8s
  # Service is named "<release>-id-generator" on port 80.
  idGeneratorInternalUrl: 'http://{{ .Release.Name }}-id-generator/v1'

  # OpenG2P Audit Manager integration
  # Both `auditEnabled=true` AND `auditManagerUrl` must be set for emission
  # to actually happen. Defaults below mean "audit feature wired but turned
  # off" — safe to ship; per-environment overrides flip it on.
  # Wired into both staff-portal-api and partner-api (chart 4.1.x). Each
  # service consumes these globals via its own envVars block below.
  # Older service images that lack AuditMiddleware simply ignore the env
  # vars — no error.
  auditEnabled: true
  auditManagerUrl: 'http://commons-services-auditmanager:80'
  # Set to false to skip auditing of rejected anonymous calls (401/403
  # without a populated principal). Default true captures attempted
  # unauthorized access for security review.
  auditAnonymousFailures: true

  # ---------------------------------------------------------------------------
  # AWE (Approval Workflow Engine) — installed as part of the Registry platform
  # via the openg2p-awe subchart. These globals OVERRIDE the awe chart's own
  # defaults so AWE's resources do NOT collide with the registry's.
  #
  # IMPORTANT: AWE's chart defaults its DB name / secret to just `<release>`,
  # which is IDENTICAL to registryDB / registryDBSecret above. Left unchanged,
  # AWE's postgres-init would create a database and Secret with the same names
  # as the registry's, clashing on install. We namespace everything with an
  # `_awe` / `-awe` suffix so the two coexist under one release.
  # ---------------------------------------------------------------------------
  # Public AWE host (matches sandbox/prod VS). Do NOT use awe-<release>.…
  # — Keycloak redirect_uris must equal this exact host or login fails with
  # "Invalid parameter: redirect_uri".
  aweHostname: 'awe.{{ .Release.Namespace }}.openg2p.org'
  aweDB: '{{ printf "%s_awe" .Release.Name | replace "-" "_" }}'
  aweDBPort: 5432
  aweDBUser: '{{ printf "%s_awe_user" .Release.Name | replace "-" "_" }}'
  aweDBSecret: '{{ .Release.Name }}-awe'
  aweDBUserPasswordKey: '{{ .Release.Name }}-awe-db-user'

  # Staff-portal-api AWE client + db-seed AWE database seeding
  aweEnabled: true
  aweBaseUrl: 'https://{{ tpl .Values.global.aweHostname $ }}'
  # Callback-secret id — per-release so the id the staff-portal-api presents
  # (REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_SECRET_ID) and the row db-seed
  # inserts into the AWE `callback_secret` table are unique per registry
  # instance. The extension SQL (awe_meta_data/40_callback_secret.sql.tpl)
  # reads this via the AWE_CALLBACK_SECRET_ID env passed by the db-seed Job.
  aweCallbackSecretId: '{{ .Release.Name }}'
  aweHttpTimeoutSeconds: 30
  aweWebhookTimestampToleranceSeconds: 300
  aweCallbackHmacSecretName: '{{ .Release.Name }}-awe-callback-hmac'
  aweCallbackHmacSecretKey: 'hmac-secret'
  aweApproverUserPassword: 'Changeme123!'
  # AWE subchart runs under the same Helm release (service: <release>-awe)
  aweReleaseName: '{{ .Release.Name }}'

  # ---------------------------------------------------------------------------
  # Connector — external-source ingestion service (ODK Central, WebSub hubs).
  # Deployed by this chart's templates/connector/* when connector.enabled=true.
  # DB / secret names are release-scoped (same convention as AWE above) so two
  # registry instances in one namespace get independent connector stacks.
  # For an environment with a pre-existing connector DB (e.g. UD's
  # nsr_connector), override these four values to point at it.
  # ---------------------------------------------------------------------------
  # Public connector admin + webhook hostname (legacy VSSS sandbox used
  # connector.<namespace>.openg2p.org before registry-scoped naming).
  connectorHostname: 'connector-{{ tpl .Values.global.registryHostname $ }}'
  connectorDB: '{{ printf "%s_connector" .Release.Name | replace "-" "_" }}'
  connectorDBUser: '{{ printf "%s_connector_user" .Release.Name | replace "-" "_" }}'
  connectorDBSecret: '{{ .Release.Name }}-connector'
  connectorDBUserPasswordKey: '{{ .Release.Name }}-connector-db-user'

  # AWE admin Keycloak clients — release-scoped so two registry instances in
  # one namespace each get their own clients + client-secret Secret inside the
  # shared `staff` realm. The openg2p-awe subchart defaults these to fixed
  # names (awe-admin-portal / awe-admin-resolver); we override both the globals
  # (consumed by the AWE backend config + deployment) AND the keycloak-init
  # realm block below so the produced clients/secret match these names.
  aweAdminPortalClientId: '{{ .Release.Name }}-awe-admin-portal'
  aweAdminResolverClientId: '{{ .Release.Name }}-awe-admin-resolver'
  aweAdminResolverSecretName: '{{ .Release.Name }}-awe-admin-resolver'

# Logging is handled cluster-wide by OpenTelemetry + Grafana Loki (deployed by
# the platform's infra automation). The OTel agent DaemonSet tails every pod's
# logs automatically, so no per-chart logging config is needed here anymore.

# DB Seed — runs configuration and (optionally) sample data SQL scripts
# after all application pods are ready. Uses a Docker image published
# from openg2p-registry-gen2-extensions.
dbSeed:
  enabled: true
  # Seed the shared master-data DB with the connector sender registrations
  # (g2p_partners rows for edrmc-websub / ud-sr-websub / odk-vsss). Required
  # for Partner API to accept connector-fed envelopes. Idempotent
  # (ON CONFLICT DO NOTHING); disable if master data is managed elsewhere.
  seedMasterData: true
  # Load geo reference data (country->village hierarchy) into the master_data DB.
  # Opt-in / defaults OFF so existing environments are unchanged. Enable alongside
  # loadSampleData so the geo ids the registry rows derive resolve in master_data.
  # Idempotent (ON CONFLICT DO NOTHING). Uses global.masterDataDB* creds.
  loadGeoData: false
  # Load sample/demo data into the registry (disabled by default)
  loadSampleData: false
  # Upload sample profile images to MinIO (documents bucket), catalogue them
  # in g2p_registry_documents, and set record_image_document_id. Requires
  # loadSampleData=true (individuals must exist first).
  loadImages: false
  # Upload flat Jinja templates from the db-seed image to MinIO after SQL seed
  # (object key = filename = g2p_registry_documents.document_store_id).
  # Default true: the connector inbound rules (connector_websub_rules.sql)
  # reference edrmc_websub_*.j2 / ud_websub_individual.j2 by filename, so the
  # objects must exist in the templates bucket for transformation to work.
  loadTemplates: true
  image:
    repository: openg2p/openg2p-vsss-db-seed
    tag: "1.1.2"
    pullPolicy: Always
    PullSecrets: "dockerhub-openg2pbotreadony"

  # DB Seed runs as a one-shot Helm post-install/post-upgrade hook Job.
  # It's just psql replaying SQL scripts — minimal footprint, but the
  # configuration meta-data load can briefly spike memory parsing larger
  # files (especially variant extensions with sample data). Limit raised
  # to 256Mi to safely cover larger seed SQL bundles; request 64Mi reflects
  # the tiny psql baseline.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# ---------------------------------------------------------------------------
# IAM registration — self-registers this registry into the IAM staff portal.
# Runs as a one-shot post-install/post-upgrade hook Job that pushes this
# registry's tile + roles/permissions catalog (files/iam-registration/payload.json)
# to the IAM staff-portal API. The application_mnemonic is the per-release
# Keycloak client (global.authClientId) and application_url is the Staff Portal
# UI host (https://<registryHostname>), so multiple registry instances coexist.
#
# Auth: obtains an access token via client_credentials using the per-release
# staff-portal client + secret created by keycloak-init (global.authClientId /
# authClientSecret) — the same client other registry services authenticate
# with. The staff realm must be a trusted login provider in IAM (it is, since
# the registry's own staff-portal-api authenticates against it).
#
# NOTE (CORS): IAM's CORS allow-list is static and read once at IAM startup, so
# this registry's origin (https://<registryHostname>) must also be added to
# IAM_STAFF_CORS_ALLOW_ORIGINS on the IAM chart and IAM rolled. See the IAM repo
# iam-staff-portal-api/samples/README.md.
iamRegister:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  # Job-level retry budget; the script also retries token + register internally.
  backoffLimit: 5
  # Internal retry attempts (×5s) while the Keycloak client / IAM finish coming up.
  tokenMaxAttempts: 30
  registerMaxAttempts: 10
  resources:
    requests:
      cpu: 25m
      memory: 32Mi

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.registryDB $ }}'
      user: '{{ tpl .Values.global.registryDBUser $ }}'
      secret: '{{ tpl .Values.global.registryDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
      extensions:
        - 'pg_trgm'
    # Connector database — the connector service creates its own tables on
    # startup (SQLAlchemy metadata.create_all), so only the DB + user need
    # provisioning here. Names are distinct from the registry DB, so this
    # second entry is safe (see NOTE below about duplicate-name entries).
    # NOTE: this list is static — the DB is provisioned even when
    # connector.enabled=false (harmless: it just sits empty). Remove this
    # entry too if you disable the connector permanently.
    - name: '{{ tpl .Values.global.connectorDB $ }}'
      user: '{{ tpl .Values.global.connectorDBUser $ }}'
      secret: '{{ tpl .Values.global.connectorDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.connectorDBUserPasswordKey $ }}'
    # NOTE: the AWE callback-HMAC secret is NOT provisioned here. A second
    # entry reusing this same db name would render a duplicate postgres-init
    # Job (Helm 4 SSA "spec.template field is immutable") and, with the
    # idempotent init-db.sh, overwrite nsr_user's password with the HMAC value.
    # It is minted directly by templates/awe-callback-hmac-secret.yaml instead.

partnerApi:
  enabled: true
  nameOverride: partner-api
  hostname: 'partner-{{ tpl .Values.global.registryHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-vsss-partner-api
    tag: "1.1.2"
    pullPolicy: Always
    PullSecrets: "dockerhub-openg2pbotreadony"
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: "/"

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      # Hostname inlined (not `tpl .Values.hostname $`) — the component templates
      # rebind `.Values` to staffPortalApi/partnerApi sub-tree via deepCopy,
      # which boxes string values as interface{} and breaks nested `tpl`.
      # `.Values.global.*` is preserved un-boxed in the rebound context.
      host: 'partner-{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-partner-api'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '{{ .Values.openapiRootPath | toString | trimSuffix "/" }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: 'partner-{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_PARTNER_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'
    REGISTRY_PARTNER_API_PORT: '{{ .Values.containerPort }}'

    REGISTRY_PARTNER_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_PARTNER_API_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_PARTNER_API_KEYMANAGER_API_BASE_URL: "{{ .Values.global.keymanagerInstallationName }}/v1/keymanager"
    REGISTRY_PARTNER_API_KEYMANAGER_API_TIMEOUT: 10
    REGISTRY_PARTNER_API_KEYMANAGER_API_DOMAIN: "AUTH"
    REGISTRY_PARTNER_API_KEYMANAGER_SSL_VERIFY: False
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_ENABLED: '{{ .Values.global.registryKeymanagerAuthEnabled }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_APP_ID: '{{ tpl .Values.global.registryKeymanagerAppId $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_REF_ID: ""

    REGISTRY_PARTNER_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_PARTNER_API_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_PARTNER_API_MINIO_BUCKET_NAME: '{{ tpl .Values.global.defaultBucketName $ }}'
    REGISTRY_PARTNER_API_TEMPLATE_BUCKET_NAME: '{{ tpl .Values.global.templateBucketName $ }}'

    # OpenG2P Audit Manager integration. No-op unless both AUDIT_ENABLED=true
    # and AUDIT_MANAGER_URL are set (controlled via global.auditEnabled and
    # global.auditManagerUrl). Safe to leave wired in older images that lack
    # the AuditMiddleware — env vars are simply ignored there. Partner-api
    # actor identity defaults to anonymous until controllers opt in to set
    # request.state.audit_actor — see the Audit Manager docs (Integration
    # with Registry → Audit Middleware — Partner API) for the enrichment
    # pattern.
    REGISTRY_PARTNER_API_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    REGISTRY_PARTNER_API_AUDIT_MANAGER_URL: '{{ .Values.global.auditManagerUrl }}'
    REGISTRY_PARTNER_API_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'
  envVarsFrom:
    REGISTRY_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_PARTNER_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_PARTNER_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_PARTNER_API_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.authClientSecret $ }}'
        key: '{{ tpl .Values.global.authClientSecretKey $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.authClientSecret $ }}'
        key: '{{ tpl .Values.global.authClientSecretKey $ }}'
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_PARTNER_API_DB_USERNAME} -h ${REGISTRY_PARTNER_API_DB_HOSTNAME} -p ${REGISTRY_PARTNER_API_DB_PORT:-5432} -d ${REGISTRY_PARTNER_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Partner API is a FastAPI process that handles partner ingestion calls.
  # Memory profile is steady-state low (~150-200Mi idle), with significant
  # spikes during bulk ingest of partner records (large multipart payloads,
  # deserialised into Python objects, then chunked and queued via Celery).
  # Limit raised to 1Gi to absorb peak ingest bursts (lesser value was causing
  # OOM); request 256Mi gives the scheduler a realistic footprint to plan around.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

benePortalApi:
  enabled: false
  nameOverride: bene-portal-api
  hostname: 'bene-{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-registry-bene-portal-api
    tag: "1.1.2"
    pullPolicy: Always
    PullSecrets: "dockerhub-openg2pbotreadony"
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: "/"

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ .Release.Name }}-bene-portal-api'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '{{ .Values.openapiRootPath | toString | trimSuffix "/" }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_BENE_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_BENE_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_BENE_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_BENE_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_BENE_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_BENE_PORTAL_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_BENE_PORTAL_API_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    # TODO: bene-portal-api is disabled by default for VSSS, so this hardcoded
    # bucket isn't biting today — but it (a) doesn't follow the per-release
    # bucket naming the other components use (global.defaultBucketName /
    # global.templateBucketName) and (b) uses the plural "templates" while
    # the rest of the chart standardised on singular "template". When/if
    # bene-portal is enabled, switch to:
    #   '{{ tpl .Values.global.templateBucketName $ }}'
    # so two registry instances in the same namespace don't share buckets.
    REGISTRY_BENE_PORTAL_API_MINIO_BUCKET_NAME: "templates"
  envVarsFrom:
    REGISTRY_BENE_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_BENE_PORTAL_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_BENE_PORTAL_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_BENE_PORTAL_API_DB_USERNAME} -h ${REGISTRY_BENE_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_BENE_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_BENE_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Beneficiary Portal API is a FastAPI process serving the beneficiary
  # self-service portal. Workload profile mirrors Partner API: low
  # baseline, per-request bursts. Same envelope as Partner API (256Mi
  # requested / 768Mi limit) for predictability across the three API pods.
  # Disabled by default (enabled: false above) — sizing assumes it will
  # be turned on in production deployments that surface a beneficiary UI.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

