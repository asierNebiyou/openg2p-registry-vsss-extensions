    REGISTRY_STAFF_PORTAL_API_KEYCLOAK_ADMIN_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.keycloakAdminClientSecret $ }}'
        key: '{{ tpl .Values.global.keycloakAdminClientSecretKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_STAFF_PORTAL_API_DB_USERNAME} -h ${REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_STAFF_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_STAFF_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Staff Portal API is the primary read-write FastAPI for registry staff
  # operations — handles registrant CRUD, lookup, search, intake validation,
  # and MinIO pre-signed URL generation. Heavier than Partner API because
  # search/listing endpoints can return larger result sets and the entire
  # page of results is materialised as Python objects (typically 3-4x the
  # JSON size). Limit raised to 1Gi to absorb large listing spikes safely;
  # request 256Mi reflects steady-state baseline.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

staffPortalUi:
  enabled: true
  nameOverride: staff-portal-ui
  hostname: '{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-registry-staff-portal-ui
    tag: "1.1.2"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  containerPort: 3000

  # Staff Portal UI is a Next.js SSR app. Node + SSR rendering keeps RSS
  # around 200-300Mi steady-state but Node's V8 heap can balloon on cold
  # start (JIT warmup), large page pre-render, or many concurrent SSR
  # requests. 512Mi proved tight under load — raised limit to 1Gi which
  # matches typical Next.js production sizing. CPU is mostly idle between
  # user actions — 50m request is enough; bursts handled by un-capped limit.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-ui'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # Configuration parameters
  partnerIngestUrl: 'https://partner-{{ tpl .Values.global.registryHostname $ }}/partner/ingest_data?data_model=dcivc'
  vpPresentationId: "7f3c2a91-bb84-4d1f-9a6e-41c8e5a0d9f2"
  vpPurpose: "Digital identity verification for registry onboarding"

  envVars:
    # Per-release identifiers so two registry installs in the same namespace
    # don't share UI/audit identity. Both mnemonics MUST equal the IAM /
    # Keycloak application id (global.authClientId) — e.g. registry-staff-portal.
    # Using Release.Name-ui here previously caused IAM permission mismatches
    # and a login redirect loop.
    APP_MNEMONIC: '{{ tpl .Values.global.authClientId $ }}'
    APP_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    APPLICATION_MNEMONIC: '{{ tpl .Values.global.authClientId $ }}'
    # Server-side calls from the Next.js Staff Portal UI pod to the Staff
    # Portal API stay inside the cluster — sibling K8s Service is named
    # "<release>-staff-portal-api" on port 80. Browser-side calls from the
    # client should use a separate NEXT_PUBLIC_* var pointing to the public
    # https://staff-<host> hostname (add when needed).
    BACKEND_API_URL: 'http://{{ .Release.Name }}-staff-portal-api'
    COOKIE_DOMAIN: '.{{ .Release.Namespace }}.openg2p.org'
    # Browser-facing (logout redirect). Keep iamServiceUrl internal for the API.
    IAM_URL: '{{ tpl .Values.global.iamPublicUrl $ }}'
    KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/logout'
    LOGIN_PROVIDER_ID: '1'
    MASTERDATA_BACKEND_API_URL: '{{ .Values.global.masterDataApiUrl }}'
    NODE_ENV: production
    PAGE_SIZE: '10'
    PARTNER_IMPORT_EXPORT_ENABLE: 'true'
    PARTNER_INGEST_URL: '{{ tpl .Values.partnerIngestUrl $ }}'
    REDIRECT_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    VERIFY_SERVICE_URL: 'https://{{ tpl .Values.global.registryHostname $ }}/v1/verify'
    VP_CLIENT_ID: 'did:web:{{ tpl .Values.global.registryHostname $ }}:v1:verify'
    VP_PRESENTATION_ID: '{{ .Values.vpPresentationId }}'
    VP_PURPOSE: '{{ .Values.vpPurpose }}'

  envVarsFrom: {}

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

celeryBeatProducer:
  enabled: true
  nameOverride: celery-beat-producer
  replicaCount: 1
  image:
    repository: openg2p/openg2p-vsss-celery
    tag: "1.1.2"
    PullSecrets: "dockerhub-openg2pbotreadony"
    pullPolicy: Always

  # Celery Beat Producer is NOT just a scheduler in this chart — it also
  # does batch enqueueing (REGISTRY_CELERY_BEAT_BATCH_SIZE=2000,
  # NO_OF_TASKS_TO_PROCESS=4 above). Each tick pulls up to 2000 records,
  # holds them in memory while creating up to 4 parallel task envelopes,
  # and dispatches to Redis. Python record objects + SQLAlchemy session +
  # Celery imports easily exceed 256Mi under load — observed OOM at that
  # limit. 768Mi gives ~3x headroom over a fully-loaded tick. Lower the
  # BATCH_SIZE or NO_OF_TASKS_TO_PROCESS knobs if you need to shrink this.
  resources:
    requests:
      cpu: 20m
      memory: 256Mi

  envVars:
    REGISTRY_CELERY_BEAT_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_BEAT_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_BEAT_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_BEAT_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_BEAT_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0
    REGISTRY_CELERY_BEAT_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0

    REGISTRY_CELERY_BEAT_WORKER_QUEUE: registry_worker_queue
    REGISTRY_CELERY_BEAT_BATCH_SIZE: 2000
    REGISTRY_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: 4

    REGISTRY_CELERY_BEAT_DATA_TRANSFORMATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_CLASSIFICATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_DATA_PUBLISH_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_TOPIC_REGISTER_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_DEDUPLICATION_BEAT_PRODUCER_FREQUENCY: 30
    CELERY_APP: "openg2p_registry_celery_beat_producers.main.celery_app"
    CELERY_OPTS: "worker --beat --loglevel=info --schedule=/tmp/celery-beat-schedule.db"

  envVarsFrom:
    REGISTRY_CELERY_BEAT_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_BEAT_DB_USERNAME}
      -h ${REGISTRY_CELERY_BEAT_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_BEAT_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_BEAT_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  serviceAccount:
    create: false
    name: ""

celeryWorker:
  enabled: true
  nameOverride: celery-worker
  replicaCount: 1
  image:
    repository: openg2p/openg2p-vsss-celery
    tag: "1.1.2"
    pullPolicy: Always
    PullSecrets: "dockerhub-openg2pbotreadony"

  # Celery Worker is the largest variable-load component in the chart. It
  # processes async tasks (bulk partner ingest, data transformation,
  # classification) — RSS can sit at ~200Mi idle but spike well past 1Gi
  # when crunching large CSV ingests or running classification on big
  # batches. Limit at 1.5Gi gives headroom for the worst observed peak
  # plus the same per-tick batch shape as the beat producer; request
  # 768Mi reserves enough that the scheduler doesn't over-pack workers
  # onto a node. CPU request 100m (10% core) reflects active processing
  # baseline; bursts allowed up to node capacity. If workloads grow,
  # prefer horizontal scaling (replicaCount) before raising per-pod limits.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi

  envVars:
    REGISTRY_CELERY_WORKERS_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_WORKERS_DB_PORT: 5432
    REGISTRY_CELERY_WORKERS_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_CELERY_WORKERS_CELERY_BROKER_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_CELERY_BACKEND_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_WORKER_QUEUE: "registry_worker_queue"

    REGISTRY_CELERY_WORKERS_BATCH_SIZE: 2000
    REGISTRY_CELERY_WORKERS_WORKER_MAX_ATTEMPTS: 5

    REGISTRY_CELERY_WORKERS_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_CELERY_WORKERS_MINIO_BUCKET_NAME: '{{ tpl .Values.global.defaultBucketName $ }}'
    REGISTRY_CELERY_WORKERS_TEMPLATE_BUCKET_NAME: '{{ tpl .Values.global.templateBucketName $ }}'
    REGISTRY_CELERY_WORKERS_FUNCTIONAL_ID_GENERATION_URL: '{{ tpl .Values.global.idGeneratorInternalUrl $ }}'
    REGISTRY_CELERY_WORKERS_ID_GENERATION_ALLOCATION_PATH: '/idgenerator/{id_type}/id'
    CELERY_APP: "openg2p_registry_celery_workers.main.celery_app"
    CELERY_OPTS: "worker -Q registry_worker_queue --loglevel=info"
    REGISTRY_CORE_KEYCLOAK_TOKEN_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    REGISTRY_CORE_KEYCLOAK_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'

  envVarsFrom:
    REGISTRY_CELERY_WORKERS_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_CELERY_WORKERS_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_CORE_KEYCLOAK_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.authClientSecret $ }}'
        key: '{{ tpl .Values.global.authClientSecretKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_WORKERS_DB_USERNAME}
      -h ${REGISTRY_CELERY_WORKERS_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_WORKERS_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_WORKERS_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  serviceAccount:
    create: false
    name: ""

# ---------------------------------------------------------------------------
# Connector — pulls registrations from external sources (ODK Central pull,
# WebSub push) and hands them to the registry through the Partner API's
# /partner/ingest_data endpoint. Four roles share one image:
#   api    — REST API + webhook receiver (also serves the connector admin UI's
#            backend); creates the connector DB tables on startup.
#   worker — Celery worker executing poll/ingest runs.
#   beat   — Celery beat scheduler (singleton) driving periodic polls.
#   consumer — long-lived stream consumer (optional, off by default).
# The admin SPA ships as a separate image (connector-ui).
#
# Ingestion path: connector -> http://<release>-partner-api/partner/ingest_data
# ?data_model=<data_model_mnemonic>. The registry side of each connector
# (data model, key paths, semantic patterns, incoming templates and the Jinja
# transformation templates) is seeded by the db-seed job from the extension's
# meta_data SQL (registry-inbound-message-rules/connector_websub_rules.sql
# and friends) — no manual SQL needed.
# ---------------------------------------------------------------------------
connector:
  enabled: true

  # Base URL the connector uses to hand records to the registry. Default is
  # this release's Partner API Service; only override for split deployments.
  partnerIngestBaseUrl: 'http://{{ .Release.Name }}-partner-api'

  # Shared image for api / worker / beat / consumer roles. Currently published
  # from the openg2p-connector-service repo under the maintainer's registry;
  # switch to an openg2p/ repository once CI publishes one.
  image:
    repository: asierneb/openg2p-connector-service
    tag: vsss-slashfix-202605221435
    pullPolicy: Always
    PullSecrets: ""

  commonEnv:
    dbDriver: postgresql+asyncpg
    logLevel: INFO
    storeRunPayloads: "true"
    strictIncremental: "true"
    fullScanOnIncrementalUnsupported: "false"
    metricsEnabled: "true"

  # Extra flat CONNECTOR_* env vars appended verbatim to every role
  # (values are rendered through tpl).
  extraEnvVars: {}

  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client:latest

  api:
    enabled: true
    replicaCount: 1
    containerPort: 8050
    service:
      port: 80
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

  worker:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi

  beat:
    enabled: true
    # Celery beat must remain a singleton.
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 128Mi

  consumer:
    enabled: false
    replicaCount: 1
    resources: {}

  ui:
    enabled: true
    replicaCount: 1
    containerPort: 8080
    service:
      port: 80
    image:
      repository: asierneb/openg2p-connector-ui
      tag: vsss
      pullPolicy: Always
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      gateway: internal
      # Optional aliases (e.g. connector-registry.<ns>.openg2p.org during migration).
      extraHosts: []
      # These prefixes go to connector-api; anything else serves the admin SPA.
      # /webhook must stay here — WebSub hubs deliver on it.
      apiPrefixes:
        - /connectors
        - /runs
        - /dlq
        - /metadata
        - /health
        - /webhook

  # -------------------------------------------------------------------------
  # Connector definition seeding — post-install/post-upgrade Job that upserts
  # the definitions below through the connector API (matched by name, so it
  # is safe to re-run on every upgrade).
  #
  # Credentials are NOT stored in values: every ${PLACEHOLDER} is resolved
  # from the Secret named by existingSecret. Create it before (or after)
  # install — connectors with unresolved placeholders are skipped with a
  # warning and picked up on the next `helm upgrade`:
  #
  #   kubectl -n <ns> create secret generic <release>-connector-seed \
  #     --from-literal=EDRMC_WEBSUB_CLIENT_SECRET=... \
  #     --from-literal=EDRMC_WEBSUB_WEBHOOK_SECRET=... \
  #     --from-literal=UD_WEBSUB_CLIENT_SECRET=... \
  #     --from-literal=UD_WEBSUB_WEBHOOK_SECRET=... \
  #     --from-literal=ODK_EMAIL=... \
  #     --from-literal=ODK_PASSWORD=...
  # -------------------------------------------------------------------------
  seed:
    enabled: true
    existingSecret: '{{ .Release.Name }}-connector-seed'
    syncWebsubSubscriptions: "true"
    backoffLimit: 3
    image:
      repository: python
      tag: 3.12-alpine
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

    # The three MGLSD VSSS production connectors. Strings are tpl-rendered, so
    # callback URLs track global.connectorHostname automatically.
    connectors:
      - name: EDRMC VSSS WebSub
        platform: edrmc_websub
        transport_type: websub
        enabled: true
        paused: false
        # Uppercase to match data_models.data_model_mnemonic exactly (the
        # connector upper-cases this before calling the Partner API anyway).
        data_model_mnemonic: EDRMC_WEBSUB_V1
        mapper_expression: >-
          {source_system: 'edrmc_websub',
          registration_type: ((groupData.is_group == `false` || groupData.is_returnee == `true` || individualData) && 'individual') ||
          ((group_data.is_group == `false` || group_data.is_returnee == `true` || individual_data) && 'individual') ||
          ((groupData || group_data) && 'household') || (is_group == `true` && 'household') || 'individual',
          source_record: individualData || individual_data || groupData || group_data || @}
        g2p_sender_id: edrmc-websub
        g2p_register_mnemonic: Individual
        source_config_json: '{"hub_url":"https://websub.hrp.edrmc.gov.et/hub","partner_id":"openg2p-sr-prod","callback_url":"https://{{ tpl .Values.global.connectorHostname $ }}/webhook/by-slug/edrmc-websub"}'
        auth_type: oauth2_client_credentials
        auth_secret_json: '{"token_url":"https://keycloak.hrp.edrmc.gov.et/realms/master/protocol/openid-connect/token","client_id":"openg2p-sr-prod","client_secret":"${EDRMC_WEBSUB_CLIENT_SECRET}","scope":"openid"}'
        webhook_secret: '${EDRMC_WEBSUB_WEBHOOK_SECRET}'
        webhook_path_slug: edrmc-websub
        webhook_verifier: hmac_sha256

      - name: UD Social Registry WebSub
        platform: ud_websub
        transport_type: websub
        enabled: true
        paused: false
        data_model_mnemonic: UD_WEBSUB_INDIVIDUAL_V1
        mapper_version: ud-websub-sr-v1
        mapper_expression: >-
          {source_system: 'ud_websub_sr',
          id: groupData.id || individualData.id,
          name: groupData.name || individualData.name,
          complete_name: groupData.complete_name || individualData.complete_name,
          name_am: groupData.name_am || individualData.name_am,
          given_name: groupData.given_name || individualData.given_name,
          family_name: groupData.family_name || individualData.family_name,
          addl_name: groupData.addl_name || individualData.addl_name,
          birthdate: groupData.birthdate || individualData.birthdate,
          age: groupData.age || individualData.age,
          gender: groupData.gender || individualData.gender,
          marital_status: groupData.marital_status || individualData.marital_status,
          education: groupData.education || individualData.education,
          registration_date: groupData.registration_date || individualData.registration_date,
          unique_id: groupData.unique_id || individualData.unique_id,
          rid: groupData.rid || individualData.rid,
          lang: groupData.lang || individualData.lang,
          phone: groupData.phone || individualData.phone,
          mobile: groupData.mobile || individualData.mobile,
          email: groupData.email || individualData.email,
          phone_number_ids: groupData.phone_number_ids || individualData.phone_number_ids,
          disability_status: groupData.disability_status || individualData.disability_status,
          current_source_income: groupData.current_source_income || individualData.current_source_income,
          source_income: groupData.source_income || individualData.source_income,
          current_region: groupData.current_region || individualData.current_region,
          current_zone: groupData.current_zone || individualData.current_zone,
          current_woreda: groupData.current_woreda || individualData.current_woreda,
          region: groupData.region || individualData.region,
          zone: groupData.zone || individualData.zone,
          woreda: groupData.woreda || individualData.woreda,
          hotspot: groupData.hotspot || individualData.hotspot,
          name_consent: groupData.name_consent || individualData.name_consent,
          homeless_date: groupData.homeless_date || individualData.homeless_date,
          spend_night: groupData.spend_night || individualData.spend_night,
          religion: groupData.religion || individualData.religion,
          websub_sent_at: groupData.websub_sent_at || individualData.websub_sent_at,
          create_date: groupData.create_date || individualData.create_date,
          write_date: groupData.write_date || individualData.write_date}
        g2p_sender_id: ud-sr-websub
        g2p_register_mnemonic: Individual
        source_config_json: '{"hub_url":"https://websub.ud.example.local/hub","partner_id":"openg2p-sr-reporting-kafka-prod","callback_url":"https://{{ tpl .Values.global.connectorHostname $ }}/webhook/by-slug/ud-websub"}'
        auth_type: oauth2_client_credentials
        auth_secret_json: '{"token_url":"https://keycloak.ud.example.local/realms/master/protocol/openid-connect/token","client_id":"openg2p-sr-reporting-kafka-prod","client_secret":"${UD_WEBSUB_CLIENT_SECRET}","scope":"openid"}'
        webhook_secret: '${UD_WEBSUB_WEBHOOK_SECRET}'
        webhook_path_slug: ud-websub
        webhook_verifier: hmac_sha256

      - name: ODK VSSS v13
        platform: odk
        transport_type: odk_central
        enabled: true
        paused: false
        # Matches the existing NSR_REGISTRATION_V11 data model from
        # data-models/data_models.sql.
        data_model_mnemonic: NSR_REGISTRATION_V11
        mapper_version: vsss-v13-normalize-registration-type
        mapper_expression: >-
          merge(@, {registration_type:
          ((registration_type == 'individuals' || registration_type == 'individual') && 'individual') ||
          ((registration_type == 'households' || registration_type == 'household' || registration_type == 'houshold') && 'household') ||
          registration_type,
          functional_record_id: functional_record_id || __id || meta.instanceID})
        g2p_sender_id: odk-vsss
        g2p_register_mnemonic: Individual
        # Sandbox ODK Central (prod host odk-vsss.ud.example.local is unreachable from this cluster).
        source_config_json: '{"base_url": "https://odk.{{ .Release.Namespace }}.openg2p.org", "project_id": 1, "form_id": "nsr_registration_v13", "page_size": 100, "max_pages": 20, "use_draft": false, "poll_interval_seconds": 300, "resolve_nav_links": true, "strict_incremental": true}'
        auth_type: odk_session
        auth_secret_json: '{"email": "${ODK_EMAIL}", "password": "${ODK_PASSWORD}"}'
        webhook_verifier: hmac_sha256

