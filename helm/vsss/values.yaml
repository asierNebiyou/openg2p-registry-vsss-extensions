# MGLSD Village Social Security System — values overlay for the openg2p-registry
# chart.
#
# This chart is a pure values overlay: it owns no templates. It deploys the
# openg2p-registry subchart (pinned in Chart.yaml, aliased `registry`) with the
# VSSS overrides below.
#
#     helm dependency build ./helm/vsss
#     helm install vsss ./helm/vsss --set global.registryHostname=vsss.example.org
#
# Everything the subchart already defaults (MinIO, Keycloak, IAM, audit, AWE
# globals, keymanager, id-generator wiring) is intentionally NOT repeated here.
# Override those on the `registry:` key or via global.* only when VSSS must
# differ from the platform default.
#
# NO INBOUND CONNECTORS
#   This chart used to ship a connector stack (api / worker / beat / admin UI)
#   plus three connector definitions inherited from the MoWSA NSR lineage:
#   EDRMC WebSub, UD Social Registry WebSub and ODK. All three were Ethiopian —
#   the EDRMC definition still pointed at live production
#   (websub.hrp.edrmc.gov.et, partner_id openg2p-sr-prod) and the ODK form was
#   nsr_registration_v13 with a woreda/zone/region mapper. None of it applies to
#   a Uganda VSSS deployment, so the connector templates, the connector DB, the
#   inbound message rules and the sender-partner rows are all gone. VSSS
#   registers through the staff portal and intake forms.
#
#   To add a real inbound source later you need, together: a data model in
#   meta_data/data-models/, key paths + semantic patterns + an incoming template
#   in meta_data/registry-inbound-message-rules/, a g2p_partners row for the
#   sender id, and the connector stack re-enabled.

# ── Image namespace ───────────────────────────────────────────────────────────
# ONE place to switch where the VSSS images are pulled from. `openg2p` is the
# namespace CI publishes to; set it to a personal namespace for local or
# pre-release builds, e.g.
#
#     helm install vsss ./helm/vsss --set global.vsssImageNamespace=asierneb
#
# The openg2p-registry subchart does not tpl-render image.repository, so the
# five `registry.*.image.repository` entries below spell the namespace out; keep
# them in step with this value when you change it (or use --set for both).
global:
  vsssImageNamespace: openg2p
  vsssImageTag: "1.2.0"

  registryVariant: 'vsss'
  postgresqlHost: commons-postgresql
  registryDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  masterDataDB: 'master_data'
  masterDataDBPort: 5432
  masterDataDBUser: 'master_data_user'
  masterDataDBSecret: 'master-data-db-user'
  masterDataDBUserPasswordKey: 'master-data-db-user-password'
  redisInstallationName: '{{ .Release.Name }}-redis-master'
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

  # Do NOT set global.imagePullSecrets — it is inherited by dependency
  # subcharts (e.g. idgenerator) and can break their templates. Set
  # image.pullSecrets on each private image below instead.
  # Create the secret in the install namespace before install/upgrade:
  #   kubectl -n <ns> create secret docker-registry dockerhub-openg2pbotreadonly \
  #     --docker-server=https://index.docker.io/v1/ \
  #     --docker-username='<user>' \
  #     --docker-password='<token>'

# ── openg2p-registry subchart overrides ───────────────────────────────────────
registry:
  # VSSS-built images. Staff UI stays on the public openg2p-registry-staff-ui
  # base image (subchart default, tagged with the platform version) — VSSS
  # ships no UI image of its own, so there is no UI tag to drift.
  staffApi:
    image:
      repository: openg2p/openg2p-vsss-staff-portal-api
      tag: 1.2.0
      imagePullSecrets: ["dockerhub-openg2pbotreadonly"]
  partnerApi:
    image:
      repository: openg2p/openg2p-vsss-partner-api
      tag: 1.2.0
      imagePullSecrets: ["dockerhub-openg2pbotreadonly"]
  celeryWorker:
    image:
      repository: openg2p/openg2p-vsss-celery
      tag: 1.2.0
      imagePullSecrets: ["dockerhub-openg2pbotreadonly"]
  celeryBeat:
    image:
      repository: openg2p/openg2p-vsss-celery
      tag: 1.2.0
      imagePullSecrets: ["dockerhub-openg2pbotreadonly"]
  dbSeed:
    image:
      repository: openg2p/openg2p-vsss-db-seed
      tag: 1.2.0
      imagePullSecrets: ["dockerhub-openg2pbotreadonly"]
    # No connector senders to register in the shared master-data DB any more.
    seedMasterData: false
    # The import template and the DCI response template must exist in MinIO.
    loadGeoData: false
    loadSampleData: false
    loadImages: false
    loadTemplates: true
    loadAttributes: true
    syncGeoWidgets: true

  iamRegister:
    applicationDescription: "MGLSD Village Social Security System"

  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          individual:
            idLength: 12
          household:
            idLength: 10
          # VSSS-only register — NSR has no Village equivalent.
          village:
            idLength: 10

  # Registry DB only. The second entry here used to provision a connector DB;
  # with no connector stack there is nothing to provision it for.
  postgres-init:
    databases:
      - name: '{{ tpl .Values.global.registryDB $ }}'
        user: '{{ tpl .Values.global.registryDBUser $ }}'
        secret: '{{ tpl .Values.global.registryDBSecret $ }}'
        secretUserPasswordKey: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
        extensions:
          - 'pg_trgm'
